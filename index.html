<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>転送ページ</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
            color: #253247;
            background: #f2f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 8%, #e4edf8 0, transparent 38%),
                #f2f5f9;
        }

        main {
            width: min(100%, 560px);
            padding: clamp(32px, 7vw, 56px);
            border: 1px solid #e3e9f1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px rgb(35 55 80 / 9%);
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #58749a;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0;
            color: #1c2b40;
            font-size: clamp(1.5rem, 5vw, 2rem);
            line-height: 1.5;
        }

        .description {
            margin: 18px 0 28px;
            color: #5f6d7e;
            line-height: 1.9;
        }

        .home-link {
            display: flex;
            min-height: 56px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            border: 1px solid #d6e3f2;
            border-radius: 12px;
            background: #f5f9ff;
            color: #245d9c;
            font-weight: 600;
            line-height: 1.5;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .home-link::after {
            content: "↗";
            flex: 0 0 auto;
            font-size: 1.1rem;
        }

        .home-link:hover {
            border-color: #a9c5e5;
            background: #eaf3ff;
        }

        .home-link:focus-visible {
            outline: 3px solid #76a8e0;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .home-link {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">PAGE INFORMATION</p>
        <h1>このページは転送用のページです</h1>
        <p class="description">最新のホームページはこちらからご覧いただけます。</p>
        <a class="home-link" href="https://orzsabaku.github.io/">
            https://orzsabaku.github.io/
        </a>
    </main>
</body>
</html>
